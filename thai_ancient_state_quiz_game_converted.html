<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับของให้ถูกเมือง</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,sans-serif}
.card{transition:.25s}
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-amber-50 via-orange-50 to-stone-100 p-4">
<div class="max-w-5xl mx-auto">
<h1 class="text-4xl font-bold mb-2">จับของให้ถูกเมือง: รัฐโบราณในดินแดนไทย</h1>
<p class="mb-4 text-stone-600">HTML เวอร์ชัน (ไม่ต้องใช้ React)</p>

<div id="app"></div>
</div>

<script>
const ITEMS=[
{label:"ธรรมจักรศิลาพร้อมกวางหมอบ",answer:"ทวารวดี",icon:"🦌"},
{label:"พระปรางค์สามยอด",answer:"ละโว้",icon:"🏯"},
{label:"เหรียญศรีทวารวดยศปุญญะ",answer:"ทวารวดี",icon:"🪙"},
{label:"ศูนย์กลางเมืองลพบุรี",answer:"ละโว้",icon:"📍"},
{label:"ประชากรชาวมอญโบราณ",answer:"ทวารวดี",icon:"👥"},
{label:"อิทธิพลขอมโบราณ",answer:"ละโว้",icon:"👑"},
{label:"พระพุทธรูปศิลาขาว",answer:"ทวารวดี",icon:"🗿"},
{label:"พระพุทธรูปปางนาคปรกแบบลพบุรี",answer:"ละโว้",icon:"🐍"},
{label:"พุทธเถรวาทและมหายาน",answer:"ทวารวดี",icon:"🙏"},
{label:"พราหมณ์-ฮินดูและพุทธมหายาน",answer:"ละโว้",icon:"🔥"},
{label:"นครปฐมโบราณ",answer:"ทวารวดี",icon:"⛩️"},
{label:"ศาลพระกาฬ",answer:"ละโว้",icon:"🛕"}
];
let score=0,index=0,time=120,state="ready";
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
let deck=shuffle(ITEMS);

function render(){
const app=document.getElementById("app");
if(state==="ready"){
app.innerHTML=`<div class="bg-white rounded-3xl p-8 shadow">
<h2 class="text-2xl font-bold">พร้อมเล่น</h2>
<button onclick="startGame()" class="mt-4 bg-black text-white px-6 py-3 rounded-2xl">เริ่มเกม</button>
</div>`; return;
}
if(state==="finished"){
app.innerHTML=`<div class="bg-white rounded-3xl p-8 shadow">
<h2 class="text-3xl font-bold">จบเกม</h2>
<p class="mt-3">คะแนน ${score}/${deck.length}</p>
<button onclick="location.reload()" class="mt-4 bg-black text-white px-6 py-3 rounded-2xl">เล่นใหม่</button>
</div>`; return;
}
const cur=deck[index];
app.innerHTML=`
<div class="bg-white rounded-3xl p-8 shadow">
<div class="flex justify-between"><b>คะแนน ${score}</b><b>${time}s</b></div>
<div class="text-center py-10">
<div class="text-6xl">${cur.icon}</div>
<div class="text-3xl font-bold mt-4">${cur.label}</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button onclick="answer('ทวารวดี')" class="bg-amber-500 text-white p-5 rounded-3xl text-2xl">ทวารวดี</button>
<button onclick="answer('ละโว้')" class="bg-sky-600 text-white p-5 rounded-3xl text-2xl">ละโว้</button>
</div>
</div>`;
}
function startGame(){
state="playing";
render();
window.t=setInterval(()=>{time--; if(time<=0){state="finished";clearInterval(t)} render();},1000);
}
function answer(c){
if(c===deck[index].answer) score++;
index++;
if(index>=deck.length){state="finished";clearInterval(t);}
render();
}
render();
</script>
</body>
</html>
