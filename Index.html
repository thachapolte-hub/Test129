<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมจับของให้ถูกเมือง</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:20px;
}

.card{
background:white;
max-width:600px;
margin:auto;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
padding:15px 25px;
margin:10px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

.left{
background:#f59e0b;
color:white;
}

.right{
background:#2563eb;
color:white;
}

#item{
font-size:30px;
margin:20px;
}

#result{
font-size:20px;
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h1>จับของให้ถูกเมือง</h1>

<p>คะแนน: <span id="score">0</span></p>

<div id="item"></div>

<button class="left" onclick="answer('ทวารวดี')">
ทวารวดี
</button>

<button class="right" onclick="answer('ละโว้')">
ละโว้
</button>

<p id="result"></p>
</div>

<script>

const items = [
{label:"ธรรมจักรศิลาพร้อมกวางหมอบ",answer:"ทวารวดี"},
{label:"พระปรางค์สามยอด",answer:"ละโว้"},
{label:"เหรียญศรีทวารวดยศปุญญะ",answer:"ทวารวดี"},
{label:"ศูนย์กลางเมืองลพบุรี",answer:"ละโว้"},
{label:"ประชากรชาวมอญโบราณ",answer:"ทวารวดี"},
{label:"อิทธิพลขอมโบราณ",answer:"ละโว้"},
{label:"พระพุทธรูปศิลาขาว",answer:"ทวารวดี"},
{label:"พระพุทธรูปปางนาคปรกแบบลพบุรี",answer:"ละโว้"}
];

let current = 0;
let score = 0;

function showItem(){
if(current >= items.length){
document.getElementById("item").innerHTML =
`จบเกม! ได้ ${score}/${items.length} คะแนน`;
return;
}

document.getElementById("item").innerText =
items[current].label;
}

function answer(choice){

if(choice === items[current].answer){
score++;
document.getElementById("result").innerText="ถูกต้อง!";
}
else{
document.getElementById("result").innerText=
"ผิด!";
}

document.getElementById("score").innerText=score;

current++;
showItem();
}

showItem();

</script>

</body>
</html>
