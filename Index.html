<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับของให้ถูกเมือง</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
color:#222;
}
.container{
max-width:900px;
margin:auto;
}
.card{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
}
h1,h2,h3{
margin-top:0;
}
.center{
text-align:center;
}
.btn{
border:none;
padding:15px;
border-radius:15px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}
.start{
width:100%;
background:#111;
color:white;
}
.twd{
background:#f59e0b;
color:white;
width:100%;
}
.lavo{
background:#2563eb;
color:white;
width:100%;
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}
.stat{
background:#fff;
padding:12px;
border-radius:15px;
text-align:center;
}
.item{
font-size:30px;
padding:40px 20px;
background:#fafafa;
border-radius:20px;
margin:20px 0;
}
.feedback{
padding:15px;
border-radius:15px;
margin-top:15px;
font-weight:bold;
}
.correct{
background:#dcfce7;
color:#166534;
}
.wrong{
background:#fee2e2;
color:#991b1b;
}
.info{
background:#e0f2fe;
color:#075985;
}
.hidden{
display:none;
}
.progress{
height:14px;
background:#ddd;
border-radius:999px;
overflow:hidden;
margin-bottom:15px;
}
.bar{
height:100%;
background:#10b981;
width:0%;
transition:.3s;
}
.big{
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<!-- START -->
<div id="startScreen" class="card">

<h1>🏛️ จับของให้ถูกเมือง</h1>

<p>
แยกสิ่งของให้ถูกระหว่าง
<b>ทวารวดี</b> และ <b>ละโว้</b>
ภายในเวลา 2 นาที
</p>

<ul>
<li>ตอบถูก +1 คะแนน</li>
<li>ตอบถูกติดกัน = คอมโบ</li>
<li>ตอบภายใน 2.5 วินาที</li>
<li>เล่นจนหมดรายการหรือหมดเวลา</li>
</ul>

<button class="btn start" onclick="startGame()">
▶ เริ่มเกม
</button>

</div>

<!-- GAME -->
<div id="gameScreen" class="hidden">

<div class="row">

<div class="stat">
คะแนน
<div id="score" class="big">0</div>
</div>

<div class="stat">
เวลา
<div id="time" class="big">120</div>
</div>

<div class="stat">
คอมโบ
<div id="combo" class="big">0</div>
</div>

<div class="stat">
สูงสุด
<div id="bestCombo" class="big">0</div>
</div>

</div>

<div class="card" style="margin-top:15px">

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div id="item" class="item center">
...
</div>

<div class="row">

<button class="btn twd"
onclick="answer('ทวารวดี')">
⬅ ทวารวดี
</button>

<button class="btn lavo"
onclick="answer('ละโว้')">
ละโว้ ➡
</button>

</div>

<div id="feedback"
class="feedback info">
เริ่มเล่นได้เลย
</div>

</div>

</div>

<!-- RESULT -->
<div id="resultScreen"
class="card hidden">

<h2>🏆 จบเกม</h2>

<h3 id="resultTitle"></h3>

<p>คะแนน: <span id="finalScore"></span></p>
<p>ความแม่นยำ: <span id="accuracy"></span>%</p>
<p>คอมโบสูงสุด: <span id="finalCombo"></span></p>

<button class="btn start"
onclick="startGame()">
เล่นอีกครั้ง
</button>

</div>

</div>

<script>

const ITEMS = [
{label:"ธรรมจักรศิลาพร้อมกวางหมอบ",answer:"ทวารวดี"},
{label:"พระปรางค์สามยอด",answer:"ละโว้"},
{label:"เหรียญศรีทวารวดยศปุญญะ",answer:"ทวารวดี"},
{label:"ศูนย์กลางเมืองลพบุรี",answer:"ละโว้"},
{label:"ประชากรชาวมอญโบราณ",answer:"ทวารวดี"},
{label:"อิทธิพลขอมโบราณ",answer:"ละโว้"},
{label:"พระพุทธรูปศิลาขาว",answer:"ทวารวดี"},
{label:"พระพุทธรูปปางนาคปรกแบบลพบุรี",answer:"ละโว้"},
{label:"พุทธเถรวาทและมหายาน",answer:"ทวารวดี"},
{label:"พราหมณ์-ฮินดูและพุทธมหายาน",answer:"ละโว้"},
{label:"นครปฐมโบราณ",answer:"ทวารวดี"},
{label:"ศาลพระกาฬ",answer:"ละโว้"}
];

let deck=[];
let index=0;
let score=0;
let combo=0;
let bestCombo=0;
let timeLeft=120;

let timer;
let itemTimer;

function shuffle(arr){
return [...arr].sort(()=>Math.random()-0.5);
}

function startGame(){

deck=shuffle(ITEMS);

index=0;
score=0;
combo=0;
bestCombo=0;
timeLeft=120;

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");

updateStats();

clearInterval(timer);

timer=setInterval(()=>{
timeLeft--;
updateStats();

if(timeLeft<=0){
finishGame();
}
},1000);

showItem();
}

function updateStats(){

document.getElementById("score").innerText=score;
document.getElementById("combo").innerText=combo;
document.getElementById("bestCombo").innerText=bestCombo;
document.getElementById("time").innerText=timeLeft;

let progress=(index/ITEMS.length)*100;
document.getElementById("bar").style.width=progress+"%";
}

function showItem(){

clearTimeout(itemTimer);

if(index>=deck.length){
finishGame();
return;
}

document.getElementById("item").innerText=
deck[index].label;

document.getElementById("feedback").innerText=
"เลือกเมืองให้ถูกภายใน 2.5 วินาที";

document.getElementById("feedback").className=
"feedback info";

itemTimer=setTimeout(()=>{

combo=0;

document.getElementById("feedback").innerText=
"หมดเวลา!";

document.getElementById("feedback").className=
"feedback wrong";

index++;

updateStats();

setTimeout(showItem,700);

},2500);

}

function answer(choice){

clearTimeout(itemTimer);

const current=deck[index];

if(choice===current.answer){

score++;
combo++;

if(combo>bestCombo){
bestCombo=combo;
}

document.getElementById("feedback").innerText=
"ถูกต้อง!";

document.getElementById("feedback").className=
"feedback correct";

}else{

combo=0;

document.getElementById("feedback").innerText=
"ผิด! คำตอบคือ "+current.answer;

document.getElementById("feedback").className=
"feedback wrong";
}

index++;

updateStats();

setTimeout(showItem,700);

}

function finishGame(){

clearInterval(timer);
clearTimeout(itemTimer);

document.getElementById("gameScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

const accuracy=
Math.round(score/ITEMS.length*100);

let title="ลองใหม่อีกครั้ง";

if(accuracy>=90){
title="ยอดนักแยกเมือง!";
}else if(accuracy>=70){
title="เก่งมาก!";
}else if(accuracy>=50){
title="ดีเลย!";
}

document.getElementById("resultTitle").innerText=
title;

document.getElementById("finalScore").innerText=
score+" / "+ITEMS.length;

document.getElementById("accuracy").innerText=
accuracy;

document.getElementById("finalCombo").innerText=
bestCombo;

}

</script>

</body>
</html>
